<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Boceto de nivel</title>
<style>
body{margin:0;background:#0b1018;color:#d6e4f5;font:14px system-ui,sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px;max-width:1700px;margin:0 auto}
#app>div:first-child{position:sticky;top:12px;align-self:start}
#side{max-height:calc(100vh - 24px);overflow-y:auto;padding-right:4px}

.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;color:#7f93ad}
label{display:flex;gap:5px;align-items:center}
.box{background:#121a26;border:1px solid #243248;border-radius:8px;padding:8px;margin-bottom:8px}
.box h3{margin:0 0 6px;font-size:13px}#scene{display:flex;flex-direction:column;gap:3px;font-size:12px;margin-top:6px}
.slot{background:#0f1622;border:1px solid #243248;border-radius:6px;padding:6px;margin-top:6px}.slot.sel{border-color:#4aa8dc;box-shadow:0 0 0 1px #4aa8dc}
.slot h4{margin:0 0 4px;font-size:12px}.row{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:#7f93ad}
.row input[type=range]{flex:1;min-width:0}.row b{width:42px;text-align:right;color:#d6e4f5;font-weight:500}
.thumb{width:56px;height:56px;border:1px dashed #243248;border-radius:4px;background:#05080d center/contain no-repeat;flex:none}
button.on{border-color:#4aa8dc;box-shadow:0 0 0 1px #4aa8dc}
button,select{background:#1a2638;color:#d6e4f5;border:1px solid #243248;border-radius:5px;padding:4px 8px;font:inherit;cursor:pointer}
small,.hint{color:#7f93ad;font-size:12px}#ld{position:absolute;left:40%;top:40%;font-size:20px;color:#8cf}
@media(max-width:1000px){#app{grid-template-columns:1fr}#app>div:first-child{position:static}#side{max-height:none}}
</style></head><body><div id="ld">Generando…</div>
<div id="app"><div><canvas id="c" width="1280" height="720"></canvas>
<div class="bar"><span><b>Mover y volar: flechas o WASD</b> · R = al suelo</span>
<span>Nivel: <button data-lv="25">1000 px</button><button data-lv="50">2000 px</button><button data-lv="75">3000 px</button></span>
<label><input type="checkbox" id="terr" checked>Terreno</label><label><input type="checkbox" id="snow" checked>Nieve</label><label><input type="checkbox" id="post" checked>Bloom + viñeta</label></div></div>
<div id="side">
<div class="box"><h3>Fondo (5 capas)</h3><button id="loadScene">Cargar escena (.json)</button><input type="file" id="sceneFile" accept=".json" hidden>
<p class="hint">Exporta con el botón de la página de parallax y carga aquí el .json (o arrástralo a la ventana).</p><div id="scene"></div></div>
<div class="box"><h3>Pared y puerta</h3><p class="hint" id="objinfo"></p><p class="hint">Se ajustan en la página de parallax (tamaños, versión A/B) y llegan aquí con la escena exportada.</p></div>
</div></div><script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d'),W=cv.width,H=cv.height,CELL=40,COLS=85,WORLD=COLS*CELL;let ROWS=25,LH=1000;
const OUT='#04112a',TAU=Math.PI*2,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function Noise(seed){const r=rng(seed),P=new Float32Array(65536);for(let i=0;i<65536;i++)P[i]=r();const sm=t=>t*t*(3-2*t);
 const n=(x,y,px=0)=>{const xi=Math.floor(x),yi=Math.floor(y),u=sm(x-xi),v=sm(y-yi);
  const X0=px?((xi%px)+px)%px:xi,X1=px?(((xi+1)%px)+px)%px:xi+1,h=(a,b)=>P[((a&255)<<8)|(b&255)];
  return lerp(lerp(h(X0,yi),h(X1,yi),u),lerp(h(X0,yi+1),h(X1,yi+1),u),v)};
 const f=(x,y,o=4,px=0)=>{let a=.5,s=0,t=0,fr=1;for(let i=0;i<o;i++){s+=a*n(x*fr,y*fr,px?px*fr:0);t+=a;a*=.5;fr*=2}return s/t};
 return{n,f}}
const mix=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t)),rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
function lg(c,x0,y0,x1,y1,stops){const gr=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>gr.addColorStop(o,col));return gr}
function wrapDraw(T,fn){for(const dx of[-T,0,T])fn(dx)}
function grayNoise(w,h,cell,seed,lo,hi,px=0,oct=4){const t=mk(w,h),c=t.getContext('2d'),im=c.createImageData(w,h),N=Noise(seed);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=lo+N.f(x/cell,y/cell,oct,px)*(hi-lo),i=(y*w+x)*4;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
 c.putImageData(im,0,0);return t}
function overlayNoise(t,T,cell,seed,lo,hi,alpha){const n=grayNoise(T/2|0,H/2|0,cell,seed,lo,hi,Math.round(T/2/cell)),nc=mk(T,H),x=nc.getContext('2d');x.drawImage(n,0,0,T,H);x.globalCompositeOperation='destination-in';x.drawImage(t,0,0);
 const c=t.getContext('2d');c.globalCompositeOperation='soft-light';c.globalAlpha=alpha;c.drawImage(nc,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over'}
function blurTile(t,T,px){const big=mk(T*3,H),b=big.getContext('2d');for(let k=0;k<3;k++)b.drawImage(t,k*T,0);
 const b2=mk(T*3,H),c2=b2.getContext('2d');c2.filter=`blur(${px}px)`;c2.drawImage(big,0,0);
 const u=mk(T,H);u.getContext('2d').drawImage(b2,T,0,T,H,0,0,T,H);return u}

// ================= Piezas de dibujo =================
function icicle(c,x,y,w,h,dir=1,glow=0){c.save();c.beginPath();c.moveTo(x-w/2,y);c.quadraticCurveTo(x-w*.38,y+dir*h*.55,x-w*.04,y+dir*h);c.quadraticCurveTo(x+w*.30,y+dir*h*.5,x+w/2,y);c.closePath();
 c.fillStyle=lg(c,x-w/2,0,x+w/2,0,[[0,'#f2fcff'],[.45,'#a9e0fa'],[1,'#3f8fcf']]);if(glow){c.shadowColor='rgba(120,220,255,.8)';c.shadowBlur=glow}
 c.fill();c.shadowBlur=0;c.lineJoin='round';c.strokeStyle=OUT;c.lineWidth=2.5;c.stroke();
 c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.8;c.beginPath();c.moveTo(x-w*.22,y+dir*3);c.quadraticCurveTo(x-w*.2,y+dir*h*.4,x-w*.05,y+dir*h*.8);c.stroke();
 c.fillStyle='rgba(8,40,90,.28)';c.beginPath();c.moveTo(x+w*.12,y);c.lineTo(x+w/2,y);c.quadraticCurveTo(x+w*.30,y+dir*h*.5,x,y+dir*h*.98);c.quadraticCurveTo(x+w*.12,y+dir*h*.4,x+w*.12,y);c.fill();c.restore()}
function crystal(c,x,y,s,rot,glow){c.save();c.translate(x,y);c.rotate(rot);const w=s*.62,h=s*2.1,c0=w*.15;
 const L=[[-w,0],[-w,-.68*h],[0,-h],[c0,-.55*h],[c0,0]],R=[[c0,0],[c0,-.55*h],[0,-h],[w,-.68*h],[w,0]],T=[[-w,-.68*h],[0,-h],[w,-.68*h],[c0,-.55*h]];
 const col=glow?{L:['#9ffaff','#12b8e6'],R:['#0a8fc2','#07507f'],T:'#e6ffff'}:{L:['#eaf7ff','#8cc4ee'],R:['#6fa5d8','#365f95'],T:'#ffffff'};
 const poly=(p,f)=>{c.beginPath();p.forEach(([a,b],i)=>i?c.lineTo(a,b):c.moveTo(a,b));c.closePath();c.fillStyle=f;c.fill();c.lineJoin='round';c.strokeStyle=OUT;c.lineWidth=2.4;c.stroke()};
 if(glow){c.shadowColor='rgba(80,230,255,.95)';c.shadowBlur=s*1.6}
 poly(L,lg(c,0,-h,0,0,[[0,col.L[0]],[1,col.L[1]]]));c.shadowBlur=0;poly(R,lg(c,0,-h,0,0,[[0,col.R[0]],[1,col.R[1]]]));poly(T,col.T);
 c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1.4;c.beginPath();c.moveTo(-w*.7,-.05*h);c.lineTo(-w*.7,-.6*h);c.stroke();c.restore()}
function cluster(c,x,y,s,rot,glow,lights,R){crystal(c,x-s*.7,y,s*.62,rot-.4,glow);crystal(c,x+s*.75,y,s*.7,rot+.38,glow);crystal(c,x,y+2,s,rot,glow);
 if(glow&&lights)lights.push({x,y:y-s*1.1,r:s*(R||5),a:.9})}

// ================= Terreno por cuadrícula =================
function prof(list,n){const a=new Array(n).fill(0);let h=list[0][1];for(let c=0;c<n;c++){for(const[f,v]of list)if(c>=f)h=v;a[c]=h}return a}
let floorH,ceilH,blocks,grid;
const solid=(c,r)=>c<0||r<0||c>=COLS||r>=ROWS?true:grid[r][c];
// Nivel de prueba de "rows" celdas de alto: el suelo y el techo del boceto v2, las 4 plataformas de siempre medidas
// desde el suelo y, en niveles altos, plataformas escalonadas cada 4 filas (2 celdas de margen: nunca se tocan).
function buildLevel(rows){ROWS=rows;LH=ROWS*CELL;
 floorH=prof([[0,1],[10,2],[13,3],[18,3],[20,2],[24,4],[29,5],[34,3],[40,3],[42,2],[47,6],[55,7],[60,4],[66,2],[73,3],[75,1]],COLS);
 ceilH=prof([[0,1],[11,2],[12,4],[14,6],[16,4],[18,2],[20,1],[31,3],[35,1],[50,2],[53,1],[61,3],[66,1],[70,1]],COLS);
 blocks=[[22,12,5,1],[38,16,5,2],[56,13,4,1],[64,18,6,1]].map(([c,rb,w,h])=>[c,ROWS-rb,w,h]);
 const fill=()=>{grid=[];for(let r=0;r<ROWS;r++){grid.push([]);for(let c=0;c<COLS;c++){let s=c==0||c==COLS-1||r<ceilH[c]||r>=ROWS-floorH[c];
  for(const[bc,br,bw,bh]of blocks)if(c>=bc&&c<bc+bw&&r>=br&&r<br+bh)s=true;grid[r].push(s)}}};
 fill();
 if(ROWS>=40){const r=rng(rows*7),free=(c,rr,w,h)=>{for(let y=rr-2;y<=rr+h+1;y++)for(let x=c-2;x<=c+w+1;x++){if(y<0||y>=ROWS||x<0||x>=COLS||grid[y][x])return false}return true};
  for(let rb=21;rb<ROWS-4;rb+=4){let placed=0;for(let tries=0;tries<40&&placed<4;tries++){const w=3+Math.floor(r()*4),c=11+Math.floor(r()*(COLS-26)),rr=ROWS-rb-Math.floor(r()*2);
   if(free(c,rr,w,1)){blocks.push([c,rr,w,1]);fill();placed++}}}}
}
buildLevel(25);
function loops(){const E=new Map(),add=(a,b,c,d)=>E.set(a+','+b,[c,d]);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]){if(!solid(c,r-1))add(c,r,c+1,r);if(!solid(c+1,r))add(c+1,r,c+1,r+1);if(!solid(c,r+1))add(c+1,r+1,c,r+1);if(!solid(c-1,r))add(c,r+1,c,r)}
 const out=[];while(E.size){const k=E.keys().next().value;let[x,y]=k.split(',').map(Number);const pts=[],sx=x,sy=y;
  do{const key=x+','+y,n=E.get(key);E.delete(key);pts.push([x,y]);[x,y]=n}while(!(x==sx&&y==sy)&&E.has(x+','+y));
  out.push(pts.filter((p,i)=>{const a=pts[(i+pts.length-1)%pts.length],b=pts[(i+1)%pts.length];return(p[0]-a[0])*(b[1]-p[1])-(p[1]-a[1])*(b[0]-p[0])!=0}))}return out}
function samplePath(pts,R){const P=pts.map(([x,y])=>[x*CELL,y*CELL]),n=P.length,C=[];
 for(let i=0;i<n;i++){const a=P[(i+n-1)%n],b=P[i],c=P[(i+1)%n],l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
  const d1=[(b[0]-a[0])/l1,(b[1]-a[1])/l1],d2=[(c[0]-b[0])/l2,(c[1]-b[1])/l2],r=Math.min(R,l1/2,l2/2);
  C.push({b,p1:[b[0]-d1[0]*r,b[1]-d1[1]*r],p2:[b[0]+d2[0]*r,b[1]+d2[1]*r]})}
 const out=[],push=(x,y)=>out.push({x,y});
 for(let i=0;i<n;i++){const cur=C[i],pr=C[(i+n-1)%n],dx=cur.p1[0]-pr.p2[0],dy=cur.p1[1]-pr.p2[1],L=Math.hypot(dx,dy),k=Math.max(1,Math.round(L/4));
  for(let j=0;j<k;j++)push(pr.p2[0]+dx*j/k,pr.p2[1]+dy*j/k);
  for(let j=0;j<=8;j++){const t=j/8,u=1-t;push(u*u*cur.p1[0]+2*u*t*cur.b[0]+t*t*cur.p2[0],u*u*cur.p1[1]+2*u*t*cur.b[1]+t*t*cur.p2[1])}}
 let s=0;const m=out.length;
 out.forEach((q,i)=>{const a=out[(i+m-2)%m],b=out[(i+2)%m];let tx=b.x-a.x,ty=b.y-a.y;const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;q.tx=tx;q.ty=ty;q.nx=-ty;q.ny=tx;
  const p=out[(i+m-1)%m];s+=Math.hypot(q.x-p.x,q.y-p.y);q.s=s});return out}

// ---- columna de hielo con puerta (objeto de fondo) ----
function iceWall(c,lights){const y0=CELL,y1=(ROWS-floorH[2])*CELL,rr=rng(9),Nw=Noise(21),Rr=16;
 const edge=[];for(let y=y0;y<=y1+1;y+=55)edge.push([298+(Nw.n(y/80,1.7)-.5)*44+(y>y1-110?8:0),Math.min(y,y1)]);
 const path=()=>{c.beginPath();c.moveTo(CELL,y0+Rr);c.arcTo(CELL,y0,CELL+Rr,y0,Rr);edge.forEach(([x,y])=>c.lineTo(x,y));c.lineTo(CELL+Rr,y1);c.arcTo(CELL,y1,CELL,y1-Rr,Rr);c.closePath()};
 c.save();path();c.clip();
 const Nf=10,rows=Math.ceil((y1-y0)/55)+1,xs=[];
 for(let k=0;k<=Nf;k++){xs.push([]);for(let i=0;i<rows;i++){xs[k].push(CELL+(k/Nf)*(300-CELL)+(Nw.n(k*3.1,i*.7)-.5)*34)}}
 for(let k=0;k<Nf;k++){const t=k/(Nf-1),sh=.5+.5*Math.sin((t*1.15+.1)*Math.PI)-.15*(k%2),base=mix([46,112,176],[214,244,255],clamp(sh,0,1));
  c.beginPath();for(let i=0;i<rows;i++){const y=Math.min(y0+i*55,y1);i?c.lineTo(xs[k][i],y):c.moveTo(xs[k][i],y)}
  for(let i=rows-1;i>=0;i--)c.lineTo(xs[k+1][i],Math.min(y0+i*55,y1));c.closePath();
  c.fillStyle=lg(c,0,y0,0,y1,[[0,rgb(mix(base,[8,30,70],.35))],[.3,rgb(base)],[.8,rgb(mix(base,[255,255,255],.12))],[1,rgb(mix(base,[8,30,70],.25))]]);c.fill();
  c.strokeStyle='rgba(6,30,70,.55)';c.lineWidth=2;c.stroke()}
 for(let k=1;k<Nf;k++){c.strokeStyle=`rgba(255,255,255,${.35+.25*(k%2)})`;c.lineWidth=1.6;c.beginPath();for(let i=0;i<rows;i++){const y=Math.min(y0+i*55,y1),x=xs[k][i]+3;i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
 const gl=c.createRadialGradient(150,y0+(y1-y0)*.45,10,150,y0+(y1-y0)*.45,300);gl.addColorStop(0,'rgba(190,245,255,.55)');gl.addColorStop(1,'rgba(190,245,255,0)');c.globalCompositeOperation='screen';c.fillStyle=gl;c.fillRect(0,y0,400,y1-y0);c.globalCompositeOperation='source-over';
 c.fillStyle=lg(c,0,y0,0,y1,[[0,'rgba(2,12,35,.55)'],[.25,'rgba(2,12,35,0)'],[.85,'rgba(2,12,35,0)'],[1,'rgba(2,12,35,.4)']]);c.fillRect(0,y0,400,y1-y0);
 for(let i=0;i<60;i++){const x=CELL+rr()*250,y=y0+rr()*(y1-y0),s=1+rr()*2.5;c.fillStyle='rgba(255,255,255,.7)';c.fillRect(x,y,s,s)}
 c.restore();path();c.lineJoin='round';c.strokeStyle=OUT;c.lineWidth=5;c.stroke();
 for(let x=64;x<290;x+=20+rr()*22){const big=rr()>.55;icicle(c,x,y0+2,big?26:15,big?80+rr()*80:28+rr()*34)}
 // base: nieve, trozos de hielo y cristales
 c.fillStyle=lg(c,0,y1-30,0,y1,[[0,'#ffffff'],[1,'#a9dcf5']]);c.beginPath();c.ellipse(205,y1,92,14,0,Math.PI,0);c.fill();c.strokeStyle=OUT;c.lineWidth=2.5;c.stroke();
 cluster(c,248,y1-2,20,.1,true,lights,5);cluster(c,170,y1-1,9,-.2,true,lights,3);
 // puerta
 const dx=2*CELL,dw=64,dh=84,cx=dx+dw/2,yc=y1-dh,r=dw/2;
 c.beginPath();c.moveTo(dx,y1);c.lineTo(dx,yc);c.arc(cx,yc,r,Math.PI,0);c.lineTo(dx+dw,y1);c.closePath();
 c.fillStyle=lg(c,0,yc-r,0,y1,[[0,'#06142c'],[.7,'#020810'],[1,'#0a2a4e']]);c.fill();
 const dg=c.createRadialGradient(cx,y1,2,cx,y1,60);dg.addColorStop(0,'rgba(80,200,255,.35)');dg.addColorStop(1,'rgba(80,200,255,0)');c.save();c.clip();c.fillStyle=dg;c.fillRect(dx,yc-r,dw,dh+r);c.restore();
 const NS=9;for(let k=0;k<NS;k++){const a0=Math.PI+k*Math.PI/NS,a1=a0+Math.PI/NS,key=k==4,ro=r+(key?24:17);
  c.beginPath();c.arc(cx,yc,r,a0,a1);c.arc(cx,yc,ro,a1,a0,true);c.closePath();
  c.fillStyle=lg(c,0,yc-ro,0,yc,[[0,key?'#d9e9f7':(k%2?'#a9bfd8':'#94abc7')],[1,key?'#9bb2cd':'#6d86a8']]);c.fill();c.strokeStyle=OUT;c.lineWidth=2.2;c.lineJoin='round';c.stroke()}
 for(let i=0;i<5;i++){const yy=yc+i*(dh/4.2);for(const sx of[dx-17,dx+dw]){c.beginPath();c.roundRect(sx,yy,17,dh/4.2+1,3);c.fillStyle=(i%2)?'#8ea6c4':'#a2b9d3';c.fill();c.stroke()}}
 c.fillStyle='#d5e6f4';c.beginPath();c.ellipse(cx,yc-r-17,30,7,0,Math.PI,0);c.fill();c.strokeStyle=OUT;c.lineWidth=2;c.stroke();
 c.beginPath();c.roundRect(dx-24,y1-7,dw+48,7,2);c.fillStyle='#7f98b8';c.fill();c.stroke()}

function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function keyAlpha(x,w,h){const d=x.getImageData(0,0,w,h),p=d.data;
 for(let i=0;i<p.length;i+=4){const m=(p[i]+p[i+2])/2-p[i+1];if(m>35){p[i+3]=p[i+3]*Math.max(0,Math.min(1,1-(m-35)/90));const k=.85*Math.min(1,m/120);p[i]=Math.max(0,p[i]-m*k);p[i+2]=Math.max(0,p[i+2]-m*k)}}
 x.putImageData(d,0,0)}
// mismo procesado que la página de parallax
function applyFx(l){if(!l.src)return;if(!l.key&&!l.bl&&!l.fd&&!l.cr){l.img=l.src;return}
 let c=mk(l.src.width-2*(l.cr||0),l.src.height),x=c.getContext('2d');x.drawImage(l.src,-(l.cr||0),0);
 if(l.key)keyAlpha(x,c.width,c.height);
 if(l.bl){const c2=mk(c.width,c.height),x2=c2.getContext('2d');x2.filter='blur('+l.bl+'px)';x2.drawImage(c,0,0);c=c2;x=x2}
 if(l.fd){x.globalCompositeOperation='source-atop';x.fillStyle='rgba(18,52,92,'+l.fd/100+')';x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='source-over'}
 l.img=c}

let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('boceto-nivel',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function dbPut(k,v){if(!db)return;try{const t=db.transaction('kv','readwrite');v==null?t.objectStore('kv').delete(k):t.objectStore('kv').put(v,k)}catch(e){}}
function dbGet(k){return new Promise(res=>{if(!db)return res(null);try{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result??null);r.onerror=()=>res(null)}catch(e){res(null)}})}

// ---------- terreno (borde procedural + roca T1), sin decoración ----------
function buildTerrain(t1){
 const t=mk(WORLD,LH),c=t.getContext('2d'),r0=rng(5),N=Noise(11),glints=[];
 const polys=loops().map(l=>samplePath(l,16)),rp=new Path2D();
 polys.forEach(p=>{p.forEach((q,i)=>i?rp.lineTo(q.x,q.y):rp.moveTo(q.x,q.y));rp.closePath()});
 const sp=new Path2D();sp.rect(0,0,WORLD,LH);sp.addPath(rp);
 c.save();c.clip(sp,'evenodd');
 const tile=mk(512,512);tile.getContext('2d').drawImage(t1,0,0,512,512,0,0,512,512);
 const pat=c.createPattern(tile,'repeat');pat.setTransform(new DOMMatrix().scale(.42));c.fillStyle=pat;c.fillRect(0,0,WORLD,LH);
 c.fillStyle='rgba(4,14,34,.35)';c.fillRect(0,0,WORLD,LH);
 const m=mk(WORLD+240,LH+240),mc=m.getContext('2d');mc.fillStyle='#010813';mc.fillRect(0,0,m.width,m.height);mc.save();mc.translate(120,120);mc.globalCompositeOperation='destination-out';mc.fill(rp);mc.restore();
 c.filter='blur(38px)';c.globalAlpha=.8;c.drawImage(m,-120,-120);c.filter='none';c.globalAlpha=1;
 const m2=mk(WORLD+240,LH+240),m2c=m2.getContext('2d');m2c.translate(120,120);m2c.fillStyle='#4fc3ff';m2c.fill(rp);
 c.globalCompositeOperation='screen';c.filter='blur(20px)';c.globalAlpha=.45;c.drawImage(m2,-120,-120);c.filter='none';c.globalAlpha=1;c.globalCompositeOperation='source-over';
 const pal={f:[[63,149,208],[134,205,242],[205,238,252],[255,255,255]],c:[[40,104,170],[84,160,218],[150,210,244],[210,240,255]]},frac=[1,.68,.4,.17];
 polys.forEach(P=>{P.forEach(q=>{const fl=clamp(q.ny,0,1),ce=clamp(-q.ny,0,1);q.w=(16+9*fl-2*ce)*(.78+.5*N.n(q.s/24,3.3))+N.n(q.s/7,9)*3;q.t=(q.ny+1)/2});
  const n=P.length;
  for(let j=0;j<4;j++)for(let i=0;i<n;i++){const A_=P[i],B=P[(i+1)%n],col=rgb(mix(pal.c[j],pal.f[j],(A_.t+B.t)/2)),f=frac[j];
   c.beginPath();c.moveTo(A_.x,A_.y);c.lineTo(B.x,B.y);c.lineTo(B.x+B.nx*B.w*f,B.y+B.ny*B.w*f);c.lineTo(A_.x+A_.nx*A_.w*f,A_.y+A_.ny*A_.w*f);c.closePath();
   c.fillStyle=col;c.strokeStyle=col;c.lineWidth=1.2;c.fill();c.stroke()}
  let nextG=0;P.forEach(q=>{if(q.s>nextG&&q.ny>.5){nextG=q.s+30+r0()*70;const ox=q.nx*q.w*.42,oy=q.ny*q.w*.42,len=8+r0()*16;c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.8;c.lineCap='round';c.beginPath();c.moveTo(q.x+ox,q.y+oy);c.lineTo(q.x+ox+q.tx*len,q.y+oy+q.ty*len);c.stroke();if(r0()>.7)glints.push({x:q.x+ox,y:q.y+oy-3,p:r0()*6})}})});
 c.restore();
 polys.forEach(P=>{c.beginPath();P.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.closePath();c.lineJoin='round';
  c.save();c.shadowColor='rgba(110,205,255,.4)';c.shadowBlur=14;c.strokeStyle='#bfe9fb';c.lineWidth=3;c.stroke();c.restore();c.strokeStyle=OUT;c.lineWidth=4.5;c.stroke()});
 return{canvas:t,glints}}

let WALLY1=(ROWS-floorH[2])*CELL; // suelo junto a la pared
// ---------- pared y puerta de los extremos del nivel (misma lógica en parallax-test y boceto-nivel) ----------
// Pared: ancho fijo en px; en vertical se parte en 3 tramos (arriba y abajo a escala, el del medio se estira o
// se repite en espejo) para cubrir cualquier altura de nivel sin deformar la cabeza ni la base. "u" = escalar todo.
function drawWallObj(g,o,leftX,rightX,yTop,yBot,cam,camY){if(!o||!o.img||o.on===false)return;yBot+=(o.dy||0);const im=o.img,H0=yBot-yTop;
 const s=o.mode==='u'?H0/im.height:(o.w||300)/im.width,dw=im.width*s,X=o.x||0;
 const one=(x0,mirror)=>{g.save();g.translate(x0-cam,0);if(mirror)g.scale(-1,1);
  if(o.mode==='u')g.drawImage(im,X,yTop-camY,dw,H0);
  else{const tt=(o.tt??25)/100,tb=(o.tb??12)/100,sh1=im.height*tt,sh3=im.height*tb,sh2=im.height-sh1-sh3,h1=sh1*s,h3=sh3*s,mid=H0-h1-h3;
   if(mid<=0){const k=H0/(h1+h3);g.drawImage(im,0,0,im.width,sh1,X,yTop-camY,dw,h1*k+1);g.drawImage(im,0,im.height-sh3,im.width,sh3,X,yTop-camY+h1*k,dw,h3*k)}
   else{g.drawImage(im,0,0,im.width,sh1,X,yTop-camY,dw,h1+1);
    if(o.mode==='s')g.drawImage(im,0,sh1,im.width,sh2,X,yTop-camY+h1,dw,mid+1);
    else{const th=sh2*s,end=yTop+h1+mid;let y=yTop+h1,j=0;
     while(y<end-.5){const hh=Math.min(th,end-y),sh=hh/s;
      if(j%2){g.save();g.translate(0,y-camY+hh);g.scale(1,-1);g.drawImage(im,0,sh1+sh2-sh,im.width,sh,X,0,dw,hh+1);g.restore()}
      else g.drawImage(im,0,sh1,im.width,sh,X,y-camY,dw,hh+1);
      y+=hh;j++}}
    g.drawImage(im,0,im.height-sh3,im.width,sh3,X,yTop-camY+h1+mid,dw,h3)}}
  g.restore()};
 g.globalAlpha=(o.op??100)/100;one(leftX,false);one(rightX,true);g.globalAlpha=1}
// Puerta: tamaño fijo en px, apoyada en el suelo, a "x" px del borde exterior; espejo en el otro extremo.
function drawDoorObj(g,o,leftX,rightX,yBot,cam,camY){if(!o||!o.img||o.on===false)return;const im=o.img,h=o.h||130,w=im.width*h/im.height,y=yBot-h+(o.dy||0)-camY,X=o.x??80;
 g.globalAlpha=(o.op??100)/100;g.drawImage(im,leftX+X-cam,y,w,h);g.save();g.translate(rightX-cam,0);g.scale(-1,1);g.drawImage(im,X,y,w,h);g.restore();g.globalAlpha=1}
let OBJ=null,objVer='B';

// ---------- capas de fondo (de la página de parallax) ----------
let L=[];
function drawLayer(l){if(!l.on||!l.img)return;const im=l.img;
 let h=H*l.s/100,w=im.width*h/im.height,y;const cmax=camYmax(),yoff=-l.y*H/200;
 if(l.vmode==='t')y=yoff-camY*l.fy;
 else if(l.vmode==='b')y=(H-h)+yoff+(cmax-camY)*l.fy;
 else{const t=cmax?camY/cmax:0,D=H-h;y=l.al==='t'?yoff+D*t*l.fp:l.al==='b'?(H-h)+yoff-D*(1-t)*l.fp:(H-h)/2+yoff+D*(t-.5)*l.fp}
 w=Math.round(w);const off=Math.round((((cam*l.f-(l.x||0))%(w*2))+w*2)%(w*2));g.globalAlpha=l.op/100;y=Math.round(y);h=Math.round(h);
 const j0=l.vm==='m'?-6:0,j1=l.vm==='m'?6:0;
 for(let j=j0;j<=j1;j++){const yy=y+j*h;if(yy>H||yy+h<0)continue;const vf=j!==0&&((j%2)+2)%2===1;
  if(l.mode==='e'){const lw=WORLD,xl=Math.round(-cam*l.f+(l.x||0)),xr=Math.round(W+(lw-W)*l.f-cam*l.f-(l.x||0));
   g.save();g.translate(xl,vf?yy+h+1:yy);g.scale(1,vf?-1:1);g.drawImage(im,0,0,w+1,h+1);g.restore();
   g.save();g.translate(xr,vf?yy+h+1:yy);g.scale(-1,vf?-1:1);g.drawImage(im,0,0,w+1,h+1);g.restore()}
  else for(let k=-2;k*w-off<W+w;k++){const x=k*w-off,mir=l.mode==='m'&&((k%2)+2)%2===1;
   g.save();g.translate(mir?x+w+1:x,vf?yy+h+1:yy);g.scale(mir?-1:1,vf?-1:1);g.drawImage(im,0,0,w+1,h+1);g.restore()}}
 g.globalAlpha=1}
async function loadScene(json,save){let data;try{data=JSON.parse(json)}catch(e){alert('JSON no válido');return}
 const out=[];for(const c of data.layers||[]){const l={...c,src:null,img:null};if(c.image){l.src=await load(c.image);applyFx(l)}out.push(l)}
 L=out;OBJ=null;objVer=data.ver||'B';
 if(data.objects){OBJ={};for(const k in data.objects){const c=data.objects[k],o={...c,src:null,img:null,bl:0,cr:0};if(c.image){o.src=await load(c.image);applyFx(o)}OBJ[k]=o}}
 if(save)dbPut('scene',json);renderSceneList()}
function renderSceneList(){const el=$('scene');el.innerHTML=L.length?'':'<small>Sin escena: exporta desde la página de parallax y cárgala aquí.</small>';
 const has=L.some(l=>l.mode==='e'&&l.img);$('objinfo').textContent=has?'Pared y puerta: capas 6 y 7 de la escena.':'La escena no trae pared ni puerta.';
 L.forEach((l,i)=>{const d=document.createElement('label');d.innerHTML=`<input type="checkbox" ${l.on?'checked':''}> Capa ${i+1}${l.front?' (delante)':''}${l.img?'':' — vacía'}`;d.querySelector('input').onchange=e=>l.on=e.target.checked;el.appendChild(d)})}

// ---------- nieve: unas capas atraviesan, otras se posan ----------
const flakes=[];
function spawn(f,top){f.z=Math.random();f.collide=f.z>.35&&Math.random()<.7;f.r=1+Math.random()*3.2*(f.collide?1:.8);f.v=22+Math.random()*48;f.ph=Math.random()*6;f.land=0;
 if(f.collide){f.x=cam-60+Math.random()*(W+120);f.y=top?camY-10-Math.random()*40:camY+Math.random()*H}else{f.x=Math.random()*W;f.y=top?-10:Math.random()*H}}
for(let i=0;i<220;i++){const f={};flakes.push(f)}
function stepSnow(dt,tm){flakes.forEach(f=>{if(f.z===undefined)spawn(f,false);
 if(f.collide){
  if(f.land>0){f.land+=dt;if(f.land>3.5)spawn(f,true);return}
  f.y+=f.v*dt;f.x+=(Math.sin(tm*.7+f.ph)*12-5)*dt;
  const cx=Math.floor(f.x/CELL),cy=Math.floor(f.y/CELL);
  if(cy>=0&&cy<ROWS&&cx>=0&&cx<COLS&&grid[cy][cx]){f.y=cy*CELL-f.r*.5+1;f.land=.001}
  if(f.y>LH||f.x<cam-120||f.x>cam+W+120)spawn(f,true)}
 else{f.y+=f.v*dt*(.5+f.z);f.x+=(Math.sin(tm*.7+f.ph)*10-6)*dt;if(f.y>H+10)spawn(f,true)}})}
function drawSnow(){flakes.forEach(f=>{let x,y,a;
 if(f.collide){x=f.x-cam;y=f.y-camY;a=f.land>0?Math.max(0,1-(f.land-1.2)/2.3):.85}
 else{x=(((f.x-cam*(.3+f.z*.6))%W)+W)%W;y=f.y;a=.25+f.z*.4}
 if(a<=0||y<-10||y>H+10)return;g.globalAlpha=a;const s=f.r*2.6;g.drawImage(flake1,x-s/2,y-s/2,s,s)});g.globalAlpha=1}

// ---------- escena ----------
let setLevel,terr,procWall,t1img,glow,flake1,bloomS,bloomL;
let cam=0,camY=0,px=600,py=0,keys={};const camYmax=()=>Math.max(0,LH-H);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let last=performance.now(),sel='A';
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const tm=now/1000,sp=380;
 if(keys.arrowright||keys.d)px+=sp*dt;if(keys.arrowleft||keys.a)px-=sp*dt;if(keys.arrowup||keys.w||keys[' '])py-=sp*dt;if(keys.arrowdown||keys.s)py+=sp*dt;
 if(keys.r)py=standY(Math.floor(px/CELL));
 px=clamp(px,60,WORLD-60);py=clamp(py,CELL+50,LH);
 cam=clamp(px-W*.4,0,WORLD-W);camY=clamp(py-H*.62,0,camYmax());
 g.fillStyle='#071426';g.fillRect(0,0,W,H);
 L.forEach(l=>{if(!l.front)drawLayer(l)});
 // paredes (fondo, detrás del borde)
 const hasA=OBJ&&OBJ.combo&&OBJ.combo.img,hasB=OBJ&&((OBJ.wall&&OBJ.wall.img)||(OBJ.door&&OBJ.door.img));
 if(objVer==='A'&&hasA)drawWallObj(g,OBJ.combo,0,WORLD,0,WALLY1+10,cam,camY);
 else if(objVer!=='A'&&hasB){drawWallObj(g,OBJ.wall,0,WORLD,0,WALLY1+10,cam,camY);drawDoorObj(g,OBJ.door,0,WORLD,WALLY1+6,cam,camY)}

 if($('terr').checked)g.drawImage(terr.canvas,Math.round(cam),Math.round(camY),W,H,0,0,W,H);
 g.save();g.globalCompositeOperation='lighter';
 terr.glints.forEach(q=>{const sx=q.x-cam,sy=q.y-camY;if(sx<-10||sx>W+10||sy<-10||sy>H+10)return;const a=Math.max(0,Math.sin(tm*2.4+q.p));if(a<.1)return;g.globalAlpha=a;const s=7*a;g.fillStyle='#fff';g.beginPath();g.moveTo(sx-s,sy);g.lineTo(sx,sy-s*.25);g.lineTo(sx+s,sy);g.lineTo(sx,sy+s*.25);g.closePath();g.fill();g.beginPath();g.moveTo(sx,sy-s);g.lineTo(sx+s*.25,sy);g.lineTo(sx,sy+s);g.lineTo(sx-s*.25,sy);g.closePath();g.fill()});
 g.restore();
 const X=px-cam,Y=py-camY;g.fillStyle='#fff';g.fillRect(X-11,Y-44,22,44);g.fillStyle='#ff5a5a';g.fillRect(X-11,Y-44,22,9);
 if($('snow').checked){stepSnow(dt,tm);drawSnow()}
 L.forEach(l=>{if(l.front)drawLayer(l)});
 if($('post').checked){const bs=bloomS.getContext('2d');bs.clearRect(0,0,W/4,H/4);bs.filter='brightness(.55) contrast(3.2)';bs.drawImage(cv,0,0,W/4,H/4);bs.filter='none';
  const bl=bloomL.getContext('2d');bl.clearRect(0,0,W/8,H/8);bl.drawImage(bloomS,0,0,W/8,H/8);
  g.globalCompositeOperation='screen';g.globalAlpha=.3;g.drawImage(bloomS,0,0,W,H);g.globalAlpha=.35;g.drawImage(bloomL,0,0,W,H);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  const vg=g.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*1.0);vg.addColorStop(0,'rgba(2,8,22,0)');vg.addColorStop(1,'rgba(2,8,22,.55)');g.fillStyle=vg;g.fillRect(0,0,W,H)}
 requestAnimationFrame(frame)}

// ---------- arrastrar la escena ----------
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();for(const f of e.dataTransfer.files)if(f.name.endsWith('.json'))f.text().then(t=>loadScene(t,true))});

(async()=>{await openDB();t1img=await load(IM.t1);
 glow=mk(128,128);flake1=mk(12,12);{const c=flake1.getContext('2d'),rg=c.createRadialGradient(6,6,0,6,6,6);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.4,'rgba(230,248,255,.8)');rg.addColorStop(1,'rgba(230,248,255,0)');c.fillStyle=rg;c.fillRect(0,0,12,12)}
 bloomS=mk(W/4,H/4);bloomL=mk(W/8,H/8);
 setLevel=rows=>{$('ld')&&($('ld').textContent='Generando…');buildLevel(rows);WALLY1=(ROWS-floorH[2])*CELL;terr=buildTerrain(t1img);px=600;py=standY(Math.floor(px/CELL));flakes.forEach(f=>f.z=undefined);
  document.querySelectorAll('[data-lv]').forEach(b=>b.classList.toggle('on',+b.dataset.lv===rows));try{localStorage.setItem('boceto-lv',rows)}catch(e){}};
 document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.lv));
 let lv=25;try{lv=+(localStorage.getItem('boceto-lv')||25)}catch(e){}setLevel(lv);
 const sc=await dbGet('scene');if(sc)await loadScene(sc,false);else renderSceneList();
 $('loadScene').onclick=()=>$('sceneFile').click();$('sceneFile').onchange=async e=>{const f=e.target.files[0];if(f)loadScene(await f.text(),true);e.target.value=''};
 py=standY(Math.floor(px/CELL));$('ld').remove();requestAnimationFrame(frame)})();
</script></body></html>
