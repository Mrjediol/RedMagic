<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cometa · perforación</title>
<style>
  :root { --bg:#1b1d24; --panel:#4a4a4a; --ink:#e8ecf2; --muted:#9aa3b2; --accent:#29c2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { padding:16px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; position:sticky; top:0; background:var(--bg); z-index:2; border-bottom:1px solid #2c303a; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  label { display:flex; gap:8px; align-items:center; color:var(--muted); }
  button { background:#2a2f3a; color:var(--ink); border:1px solid #3a4150; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { border-color:var(--accent); background:#1f3a4d; }
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap:16px; padding:16px; }
  section { background:#23262f; border-radius:10px; padding:12px; }
  h2 { font-size:15px; margin:0 0 4px; }
  p { margin:0 0 8px; color:var(--muted); font-size:13px; }
  canvas { width:100%; height:auto; background:var(--panel); border-radius:6px; display:block; }
  .lab { display:flex; flex-wrap:wrap; gap:8px; }
  .bar { display:flex; gap:6px; align-items:center; margin-top:8px; }
  .bar input[type=range] { flex:1; accent-color:var(--accent); }
  .bar button { padding:4px 9px; }
  .bar .tm { font:12px ui-monospace, monospace; color:var(--muted); min-width:46px; text-align:right; }
  .legend { font-size:12px; color:var(--muted); }
  .legend b.back { color:#ff9a3c; } .legend b.front { color:#5dff8a; }
</style>
</head>
<body>
<header>
  <h1>Ataque cometa</h1>
  <button data-tab="saved" class="on">✔ Guardados</button>
  <button data-tab="wip">🛠 En curso</button>
  <button data-tab="arc">📁 Archivo</button>
  <button data-tab="snd">🔊 Sonidos</button>
  <label>Velocidad <input id="speed" type="range" min="0.05" max="1" step="0.05" value="0.35"> <span id="speedv">0.35×</span></label>
  <button id="pause">Pausa todo</button>
  <label><input id="layers" type="checkbox"> Ver capas</label>
  <label>Espera en «listo» <input id="hold" type="range" min="0" max="1.5" step="0.05" value="0.5"> <span id="holdv">0.50s</span></label>
  <label><input id="frm" type="checkbox" checked> Impact frames</label>
  <label><input id="snd" type="checkbox"> 🔊 Sonido</label>
  <label>Carga <select id="sch"></select></label>
  <label>Listo <select id="srd"></select></label>
  <label>Disparo <select id="srl"></select></label>
  <label>Cadena <select id="scn"></select></label>
  <label>Impactos <select id="sset"><option value="A">A · Seco y pesado</option><option value="B" selected>B · Energía eléctrica</option><option value="C">C · Metal pesado</option><option value="old">Antiguo (arcade)</option></select></label>
  <span class="legend">(<b class="back">naranja</b> = detrás · <b class="front">verde</b> = delante) · cada clip tiene su barra: arrastra para rebobinar, ◀ ▶ avanzan un paso</span>
</header>
<main id="grid-saved"></main>
<main id="grid-wip" style="display:none"></main>
<main id="grid-arc" style="display:none"></main>
<main id="grid-snd" style="display:none"></main>
<script>
// ---------------------------------------------------------------- paleta del set
const C = {
  white:'#ffffff', core:'#ffe6ea', light:'#9ef2ff', cyan:'#29c2ff', blue:'#1c5cdb', purple:'#7538db',
  player:'#e07a3c', playerDark:'#8a4520', enemy:'#6a3a5c', enemyDark:'#42243a'
};
const W = 640, H = 400, GROUND = 340;
const X0 = 124, X1 = 508, YM = GROUND - 50;
const T0 = 0.35, T1 = 0.77;
const LOOP = 2.2, N = 40;

let speed = 0.35, showLayers = false;
document.getElementById('speed').oninput = e => { speed = +e.target.value; document.getElementById('speedv').textContent = speed.toFixed(2) + '×'; };
document.getElementById('layers').onchange = e => showLayers = e.target.checked;
let soundOn = false, framesOn = true;
document.getElementById('frm').onchange = e => framesOn = e.target.checked;
document.getElementById('snd').onchange = e => { soundOn = e.target.checked; if (soundOn) audioInit(); else if (AC) stopHum(); };
document.getElementById('hold').oninput = e => { HOLD = +e.target.value; document.getElementById('holdv').textContent = HOLD.toFixed(2) + 's'; };

// ---------------------------------------------------------------- utilidades
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
function rand(seed) { let s = (Math.abs(seed) * 2654435761 % 2147483647) || 1; for (let i = 0; i < 4; i++) s = (s * 16807) % 2147483647; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function col(c, layer) { return showLayers ? (layer === 'back' ? '#ff9a3c' : '#5dff8a') : c; }

function player(ctx, x, y, dir, opts = {}) {
  const { squash = 0, lean = 0 } = opts;
  ctx.save(); ctx.translate(x, y); ctx.rotate(lean * dir); ctx.scale(1 + squash, 1 - squash);
  ctx.fillStyle = C.playerDark; ctx.beginPath(); ctx.roundRect(-13, -48, 26, 48, 9); ctx.fill();
  ctx.fillStyle = C.player;
  ctx.beginPath(); ctx.ellipse(4 * dir, -60, 15, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-3 * dir, -78, 4, 11, -0.3 * dir, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(11 * dir, -62, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// knock = empujón en px; hitT = instante del golpe (flash blanco, aplastamiento y temblor)
function enemy(ctx, t, x, hitT, knockAmp, flashLen, o = {}) {
  const ht = seg(t, hitT, hitT + 0.5);
  const k = ht > 0 ? Math.sin(Math.min(ht * 2.2, 1) * Math.PI) * knockAmp : 0;
  const shake = ht > 0 && ht < 0.5 ? Math.sin(ht * 70) * (1 - ht * 2) * 3 : 0;
  const sq = ht > 0 && ht < 0.4 ? Math.sin(ht / 0.4 * Math.PI) * 0.12 : 0;
  const body = () => {
    ctx.fillStyle = C.enemyDark; ctx.beginPath(); ctx.ellipse(0, -42, 30, 42, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C.enemy; ctx.beginPath(); ctx.ellipse(-3, -46, 26, 38, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(-14, -56, 4, 0, 7); ctx.fill();
    if (o.solid) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, -42, 30, 42, 0, 0, 7); ctx.fill(); }
    else if (ht > 0 && ht < flashLen) { ctx.globalAlpha = 1 - ht / flashLen; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-3, -46, 26, 38, 0, 0, 7); ctx.fill(); }
  };
  const free = o.cy !== undefined, up = free ? GROUND - 44 - o.cy : (o.up || 0), bob = !free && up ? Math.sin(t * 3) * 2 : 0;
  ctx.save(); ctx.translate(x + k + shake, GROUND - up + bob); ctx.scale(1 - sq, 1 + sq * 0.6);
  if (o.split) {                                    // mitad de arriba y de abajo se separan por el tajo (y = -46)
    for (const s of [-1, 1]) {
      ctx.save(); ctx.beginPath(); ctx.rect(-80, s < 0 ? -140 : -46, 160, s < 0 ? 94 : 60); ctx.clip();
      ctx.translate(0, s * o.split); body(); ctx.restore();
    }
  } else body();
  if (o.flash2 !== undefined) { const ft = seg(t, o.flash2, o.flash2 + 0.14); if (ft > 0 && ft < 1) { ctx.globalAlpha = 1 - ft; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-3, -46, 26, 38, 0, 0, 7); ctx.fill(); } }
  ctx.restore();
}
function ground(ctx) {
  ctx.fillStyle = '#2f5d7a'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#3d7598'; ctx.fillRect(0, GROUND, W, 6);
}

// ---------------------------------------------------------------- recorrido y estado
// v.x(t) = posición de la cabeza en el tiempo; la cola muestrea ese historial (si la cabeza se frena, la cola se amontona).
const crossT = (v, xv) => { for (let t = 0; t < 2; t += 0.001) if (v.x(t) >= xv) return t; return 2; };
function state(t, v) {
  const span = v.tailSpan(t), th = Math.min(t, v.TB), tTail = clamp(t - span, T0, th), pts = [];
  for (let i = 0; i <= N; i++) pts.push({ x: v.x(lerp(th, tTail, i / N)), y: v.y ? v.y(lerp(th, tTail, i / N)) : YM });
  for (let i = 0; i <= N; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N, i + 1)];
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy);
    pts[i].nx = l < 0.01 ? 0 : -dy / l; pts[i].ny = l < 0.01 ? 1 : dx / l;
  }
  const h = pts[0];
  const inside = v.hits.some(e => e.pierce && Math.pow((h.x - e.ex) / 27, 2) + Math.pow((h.y - (GROUND - 44)) / 39, 2) < 1);
  return { pts, h, ang: v.ang ? v.ang(th) : 0, alive: t > T0 && t < v.TB + span, headAlive: t > T0 && t < v.TB,
           tailFade: 1 - seg(t, v.TB, v.TB + span) * 0.6, t, sc: v.scale(t), inside, pr: v.proj, shape: v.shape, up: v.up, v };
}

// ---------------------------------------------------------------- piezas
function ribbon(ctx, S, wfn, color, alpha, layer) {
  const pts = S.pts, L = [], R = [];
  for (let i = 0; i <= N; i++) {
    const p = pts[i], w = wfn(i / N) / 2;
    L.push([p.x + p.nx * w, p.y + p.ny * w]); R.push([p.x - p.nx * w, p.y - p.ny * w]);
  }
  ctx.save(); ctx.globalAlpha = alpha * S.tailFade; ctx.fillStyle = col(color, layer);
  ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
  for (const q of L) ctx.lineTo(q[0], q[1]);
  for (let i = N; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
const tailEnv = s => Math.sin(Math.PI * Math.pow(clamp(s), 0.55));   // 0 en la cabeza, máximo hacia el 30 %, vuelve a 0 en la punta
const tailRise = s => Math.pow(seg(s, 0, 0.08), 0.5);                  // el grosor también nace de 0
function strand(ctx, S, offFn, wFn, color, alpha, layer, segLayer) {
  const pts = S.pts;
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = col(color, layer);
  for (let i = 0; i < N; i++) {
    const s = i / N, a = pts[i], b = pts[i + 1], o0 = offFn(s), o1 = offFn((i + 1) / N);
    if (segLayer && segLayer(s) !== layer) continue;
    ctx.globalAlpha = alpha * S.tailFade * (1 - 0.92 * seg(s, 0.65, 1)); ctx.lineWidth = Math.max(0.3, wFn(s));
    ctx.beginPath(); ctx.moveTo(a.x + a.nx * o0, a.y + a.ny * o0); ctx.lineTo(b.x + b.nx * o1, b.y + b.ny * o1); ctx.stroke();
  }
  ctx.restore();
}
function glow(ctx, x, y, r, c0, a) {
  if (showLayers) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, AMBON ? c0.replace('160,110,255', '255,150,40').replace('120,220,255', '255,220,120').replace('140,100,255', '255,140,40').replace('90,60,230', '255,120,20').replace('30,70,220', '255,170,40').replace('110,70,255', '255,140,40') : c0); g.addColorStop(1, 'rgba(117,56,219,0)');
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function disc(ctx, x, y, r, c, a, layer) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col(c, layer); ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, 7); ctx.fill(); ctx.restore();
}
// gota: cabeza redonda en (x,y), cola afilada hacia -dir
function drop(ctx, x, y, ang, len, wid, c, a, layer) {
  if (a <= 0 || len < 0.5) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = col(c, layer);
  ctx.beginPath(); ctx.moveTo(-len, 0); ctx.quadraticCurveTo(-len * 0.2, -wid, wid * 0.6, 0); ctx.quadraticCurveTo(-len * 0.2, wid, -len, 0); ctx.fill();
  ctx.restore();
}
// trazo afilado (chispa alargada) de a→b, grueso en b
function shard(ctx, ax, ay, bx, by, w, c, a, layer) {
  if (a <= 0) return;
  const dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy) || 1, nx = -dy / l * w / 2, ny = dx / l * w / 2;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col(c, layer);
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx + nx, by + ny); ctx.lineTo(bx - nx, by - ny); ctx.closePath(); ctx.fill(); ctx.restore();
}
// anillo con ruido, mitad lejana (back) o cercana (front); squash = aplastamiento horizontal
function ringHalf(ctx, x, y, r, squash, wob, seed, width, c, a, layer) {
  if (a <= 0) return;
  const R = rand(seed), ph = [R() * 6, R() * 6, R() * 6];
  ctx.save(); ctx.globalAlpha = a; ctx.lineWidth = Math.max(0.5, width); ctx.lineCap = 'round'; ctx.strokeStyle = col(c, layer);
  ctx.beginPath();
  const a0 = layer === 'back' ? Math.PI * 0.5 : -Math.PI * 0.5;
  for (let i = 0; i <= 28; i++) {
    const th = a0 + Math.PI * i / 28;
    const rr = r * (1 + wob * (Math.sin(th * 3 + ph[0]) * 0.5 + Math.sin(th * 5 + ph[1]) * 0.3));
    const px = x + Math.cos(th) * rr * squash, py = y + Math.sin(th) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke(); ctx.restore();
}
function trailLine(ctx, fn, uHead, span, w, c, a, layer) {   // estela afilada siguiendo fn(u)
  const M = 10;
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = col(c, layer);
  let prev = null;
  for (let i = 0; i <= M; i++) {
    const u = Math.max(0, uHead - span * i / M), p = fn(u);
    if (prev) { ctx.globalAlpha = a * (1 - i / M); ctx.lineWidth = Math.max(0.3, w * (1 - i / M)); ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    prev = p;
  }
  ctx.restore();
}

// ---------------------------------------------------------------- cabeza
function headBall(ctx, S, r, layer, pulse = 1) {
  if (!S.headAlive) return;
  const { x, y } = S.h, k = r * pulse;
  if (showLayers) { disc(ctx, x, y, k, C.white, 1, layer); return; }
  glow(ctx, x, y, k * 3.6, 'rgba(160,110,255,0.9)', 0.55);
  glow(ctx, x, y, k * 2.0, 'rgba(120,220,255,0.9)', 0.5);
  disc(ctx, x, y, k * 1.25, C.cyan, 0.9, layer);
  disc(ctx, x, y, k * 0.95, C.light, 1, layer);
  disc(ctx, x, y, k * 0.6, C.white, 1, layer);
}

// ---------------------------------------------------------------- COMETA BÁSICO (S.sc escala grosores y cabeza)
function comet(ctx, t, layer, S) {
  if (S.shape === 'wavy') return cometWavy(ctx, t, layer, S);
  if (S.shape === 'helix') return cometHelix(ctx, t, layer, S);
  const sc = S.sc, pr = S.pr, tp = pr ? pr.taper : 0.9, wm = pr ? pr.wmul : ((S.up && S.up.pow) ? 0.72 : 1), wob = pr ? pr.wob : ((S.up && S.up.pow) ? 0.65 : 1);
  const up = S.up, dens = up ? up.dens : 1, nsat = up && up.sat ? up.sat : 3, pw = !!(up && up.pow);
  if (up && up.kind === 'embers') embersFx(ctx, S, layer);
  if (pw && !(S.inside && layer === 'front')) powStrands(ctx, S, t, layer, sc);
  if (up && up.pow && layer === 'front' && S.headAlive && !S.inside) { if (up.kind === 'blade') powBlades(ctx, S, t, layer, up); else powShock(ctx, S, t, layer, up); }
  if (up && up.kind === 'storm') powBolts(ctx, S, t, layer);
  if (S.alive && layer === 'back') {
    const br = 1 + 0.12 * wob * Math.sin(t * 30);
    const teeth = (w0, s) => pr && pr.saw && w0 >= 20 ? 1 + pr.saw * ((1 - ((s * 14) % 1)) - 0.5) : 1;
    const w = w0 => s => w0 * wm * sc * Math.pow(1 - s, tp) * teeth(w0, s) * (up && up.pow ? Math.pow(seg(s, 0, 0.1), 0.5) : 1) * (br + 0.08 * wob * Math.sin(t * 40 - s * 14));
    if (up && up.pow) { ribbon(ctx, S, w(34), navyC(), 0.55, layer); ribbon(ctx, S, w(30), C.purple, 0.55, layer); ribbon(ctx, S, w(26), C.blue, 0.65, layer); }
    else {
      ribbon(ctx, S, w(60), C.purple, 0.16, layer);
      ribbon(ctx, S, w(42), C.purple, 0.32, layer);
      ribbon(ctx, S, w(29), C.blue, 0.55, layer);
    }
    ribbon(ctx, S, w(20), C.cyan, 0.9, layer);
    ribbon(ctx, S, w(12), C.light, 1, layer);
    ribbon(ctx, S, w(5), C.white, 1, layer);
    const cs = [C.cyan, C.light, C.blue, C.cyan, C.light];
    for (let k = 0; k < (pw ? 0 : 5); k++)
      strand(ctx, S, s => (k % 2 ? 1 : -1) * sc * wob * (20 + k * 2.5) * tailEnv(s) * (0.55 + 0.45 * Math.sin(t * 25 + k * 2 - s * 9)),
             s => sc * (3.2 - k * 0.3) * (1 - s) * tailRise(s), cs[k], 0.85, layer);
    for (let k = 0; k < (pw ? 0 : 4); k++)
      strand(ctx, S, s => (k % 2 ? 1 : -1) * sc * wob * (5 + k * 2.2) * tailEnv(s) * Math.sin(t * 38 + k * 1.9 - s * 13),
             s => sc * 1.3 * (1 - s) * tailRise(s), k % 2 ? C.white : C.light, 0.9, layer);
  }
  if (S.alive && up && up.kind === 'braid') {        // trenza: dos hilos que se enroscan al eje de la cola (pasan por detrás y por delante)
    const amp = s => 13 * Math.pow(1 - s, 0.55) * sc + 2, ph = s => t * 20 - s * 15, depth = k => s => Math.cos(ph(s) + k * Math.PI) > 0 ? 'front' : 'back';
    for (let k = 0; k < 2; k++)
      strand(ctx, S, s => amp(s) * Math.sin(ph(s) + k * Math.PI), s => (3.6 * (1 - s * 0.8) * (0.7 + 0.3 * Math.cos(ph(s) + k * Math.PI)) + 0.4) * sc, k ? C.light : C.white, 0.95, layer, depth(k));
  }
  if (S.alive) {
    for (let i = 0; i < Math.round(16 * dens); i++) {
      const R = rand(77 + i * 19), s0 = 0.04 + R() * 0.6, side = R() < 0.5 ? -1 : 1, rate = 1.3 + R() * 1.5;
      const age = (t * rate + R()) % 1, lay = R() < 0.55 ? 'back' : 'front';
      if (lay !== layer) continue;
      const p = S.pts[Math.floor(s0 * N)], d = (5 + age * 22 * (0.6 + R())) * sc;
      drop(ctx, p.x + p.nx * side * d - age * 26, p.y + p.ny * side * d, Math.PI * 0 + side * 0.25 * age,
           (9 + R() * 10) * (1 - age * 0.6) * sc, (2.2 + R() * 2.4) * (1 - age * 0.7) * sc,
           [C.white, C.light, C.cyan, C.blue][i % 4], (1 - age) * S.tailFade, layer);
    }
    for (let i = 0; i < Math.round(14 * dens); i++) {
      const R = rand(300 + i * 17), s0 = 0.05 + R() * 0.8, side = R() < 0.5 ? -1 : 1, rate = 1.4 + R() * 1.6;
      const age = (t * rate + R()) % 1, lay = R() < 0.5 ? 'back' : 'front';
      if (lay !== layer) continue;
      const p = S.pts[Math.floor(s0 * N)], d = age * 26 * (0.5 + R()) * sc;
      disc(ctx, p.x + p.nx * side * d - age * 14, p.y + p.ny * side * d + age * age * 10, ((1 + R() * 2) * (1 - age) + 0.4) * sc,
           i % 3 === 0 ? C.white : (i % 3 === 1 ? C.light : C.cyan), (1 - age) * S.tailFade, layer);
    }
  }
  if (S.headAlive) {
    const { x, y } = S.h;
    if (S.inside) {                                   // dentro del cuerpo: sólo se ve la luz a través de él
      if (layer === 'front') { glow(ctx, x, y, 30 * sc, 'rgba(255,255,255,0.9)', 0.55); glow(ctx, x, y, 52 * sc, 'rgba(120,220,255,0.9)', 0.35); }
      return;
    }
    if (pr) { if (layer === 'front') { if (pw) { glow(ctx, x, y, 52 * sc, 'rgba(90,60,230,0.9)', 0.5); glow(ctx, x, y, 34 * sc, 'rgba(30,70,220,0.9)', 0.45); } ctx.save(); ctx.translate(x, y); ctx.rotate(S.ang); ctx.translate(-x, -y); pierceHead(ctx, S, t, sc, pr.kind); ctx.restore(); } return; }
    for (let k = 0; k < nsat; k++) {
      const a = t * 14 + k * (6.283 / nsat), sy = Math.sin(a);
      if ((sy < 0 ? 'back' : 'front') !== layer) continue;
      disc(ctx, x + Math.cos(a) * 14 * sc, y + sy * 6 * sc, (1.8 + sy * 0.4) * sc, k % 2 ? C.light : C.white, 0.95, layer);
    }
    if (layer === 'front') {
      if (!showLayers) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(S.ang); ctx.lineCap = 'round';

const X = 0.0001;

  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(X, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + att); g.gain.exponentialRampToValueAtTime(X, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function swell(type, f0, f1, t0, dur, peak) {      // sube de volumen y de tono hasta el final y corta
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(X, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + dur * 0.96); g.gain.exponentialRampToValueAtTime(X, t0 + dur + 0.04);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.08);
}
function noise(t0, dur, peak, ftype, f0, f1, q = 1, att = 0.004, rising = false) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const f = AC.createBiquadFilter(); f.type = ftype; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur); const g = AC.createGain(); g.gain.setValueAtTime(X, t0);
  if (rising) { g.gain.exponentialRampToValueAtTime(peak, t0 + dur * 0.96); g.gain.exponentialRampToValueAtTime(X, t0 + dur + 0.04); }
  else { g.gain.exponentialRampToValueAtTime(peak, t0 + att); g.gain.exponentialRampToValueAtTime(X, t0 + dur); }
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.08);
}
function stopHum() { if (humNodes) { const t = AC.currentTime; humNodes.g.gain.cancelScheduledValues(t); humNodes.g.gain.setTargetAtTime(X, t, 0.03); humNodes.os.forEach(o => o.stop(t + 0.2)); humNodes = null; } }
const SFX = {
  charge(kind, k, dur) {
    if (kind === 'R1' || kind === 'R3') kind = 'C1'; else if (kind === 'R2') kind = 'C2';
    const t = AC.currentTime + 0.02, d = dur * k;
    if (kind === 'C2') { swell('sawtooth', 120, 700, t, d, 0.05); swell('sine', 300, 1900, t, d, 0.1); swell('sine', 304, 1915, t, d, 0.08); noise(t, d, 0.07, 'highpass', 3000, 9000, 1, 0.01, true); }
    else if (kind === 'C3') {
      for (let j = 0; j < 3; j++) { const s0 = t + 0.26 * j * d, sd = d * 0.42; swell('triangle', 220 * Math.pow(1.34, j), 330 * Math.pow(1.34, j), s0, sd, 0.12); noise(s0 + sd * 0.95, 0.07 * k, 0.12, 'bandpass', 3200, 5200, 4); }
      swell('sine', 700, 1500, t + d * 0.45, d * 0.55, 0.07);
    } else { swell('triangle', 180, 780, t, d, 0.14); swell('sine', 360, 1560, t, d, 0.07); noise(t, d, 0.05, 'highpass', 1500, 7000, 1, 0.01, true); }
  },
  ready(k) {
    const t = AC.currentTime + 0.01;
    osc('sine', 1318, 1318, t, 0.55 * k, 0.16, 0.004); osc('sine', 1976, 1976, t + 0.03 * k, 0.45 * k, 0.12, 0.004); osc('triangle', 659, 659, t, 0.4 * k, 0.1, 0.004);
    noise(t, 0.08 * k, 0.12, 'highpass', 6000, 9000);
    stopHum();                                         // zumbido de "listo" que dura hasta soltar
    const g = AC.createGain(); g.gain.setValueAtTime(X, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.15);
    const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 7; lg.gain.value = 0.02; l.connect(lg); lg.connect(g.gain); l.start();
    const a = AC.createOscillator(), b = AC.createOscillator(); a.type = 'sine'; b.type = 'sine'; a.frequency.value = 330; b.frequency.value = 333;
    a.connect(g); b.connect(g); g.connect(master); a.start(t); b.start(t);
    humNodes = { g, os: [a, b, l] };
  },
  release(k) {
    stopHum(); const t = AC.currentTime + 0.01;
    noise(t, 0.3 * k, 0.28, 'bandpass', 3800, 300, 1.2, 0.01); osc('sawtooth', 1000, 120, t, 0.2 * k, 0.12, 0.005); osc('sine', 2000, 320, t, 0.12 * k, 0.14, 0.003);
  },
  pierceIn(k) { const t = AC.currentTime + 0.01; noise(t, 0.16 * k, 0.3, 'highpass', 5000, 9500, 1, 0.002); osc('sine', 2600, 1700, t, 0.16 * k, 0.16, 0.002); osc('triangle', 160, 55, t, 0.14 * k, 0.28, 0.003); },
  pierceOut(k) { const t = AC.currentTime + 0.01; noise(t, 0.12 * k, 0.18, 'highpass', 7000, 12000, 1, 0.002); osc('sine', 3300, 2400, t, 0.12 * k, 0.12, 0.002); },
  impact(k) {
    const t = AC.currentTime + 0.01;
    osc('sine', 150, 36, t, 0.35 * k, 0.5, 0.004); noise(t, 0.28 * k, 0.36, 'lowpass', 3500, 200, 0.8, 0.002);
    osc('sine', 2400, 3800, t, 0.12 * k, 0.1, 0.002); osc('triangle', 1200, 900, t + 0.04 * k, 0.2 * k, 0.07, 0.003);
  },
};
// ---------------------------------------------------------------- SONIDO v2: capas con peso (sub + cuerpo + transitorio + cola), sin pitidos agudos tipo arcade
// vThump: golpe grave con caída de tono · vNoise: ruido filtrado (opc. distorsión/reverb) · vSaw: diente de sierra con filtro que barre
// vRing: parciales inarmónicos (cuerpo metálico) · vCrackle: chisporroteo eléctrico · sendOut: salida seca + envío a reverb
function sendOut(node, wet) {
  node.connect(master);
  if (wet > 0) { const w = AC.createGain(); w.gain.value = wet; node.connect(w); w.connect(rev); }
}
const curves = {};
function driveNode(amount) {
  if (!curves[amount]) { const n = 2048, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = Math.tanh(x * amount) / Math.tanh(amount); } curves[amount] = c; }
  const ws = AC.createWaveShaper(); ws.curve = curves[amount]; ws.oversample = '2x'; return ws;
}
function vThump(t0, f0, f1, dur, peak, dr = 0, wet = 0.1) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.6);
  g.gain.setValueAtTime(X, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + 0.003); g.gain.exponentialRampToValueAtTime(X, t0 + dur);
  o.connect(g); let last = g; if (dr > 0) { const ws = driveNode(dr); g.connect(ws); last = ws; }
  sendOut(last, wet); o.start(t0); o.stop(t0 + dur + 0.05);
}
function vNoise(t0, dur, peak, type, f0, f1, q = 1, o = {}) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(X, t0);
  if (o.rising) { g.gain.exponentialRampToValueAtTime(peak, t0 + dur * 0.95); g.gain.exponentialRampToValueAtTime(X, t0 + dur + 0.03); }
  else { g.gain.exponentialRampToValueAtTime(peak, t0 + (o.att || 0.002)); g.gain.exponentialRampToValueAtTime(X, t0 + dur); }
  s.connect(f); f.connect(g); let last = g; if (o.dr) { const ws = driveNode(o.dr); g.connect(ws); last = ws; }
  if (o.pan) { const pn = AC.createStereoPanner(); pn.pan.setValueAtTime(o.pan[0], t0); pn.pan.linearRampToValueAtTime(o.pan[1], t0 + dur); last.connect(pn); last = pn; }
  sendOut(last, o.wet || 0); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.06);
}
function vSaw(t0, f0, f1, dur, peak, lp0, lp1, dr = 0, wet = 0.1) {
  const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(lp0, t0); f.frequency.exponentialRampToValueAtTime(lp1, t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(X, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + 0.006); g.gain.exponentialRampToValueAtTime(X, t0 + dur);
  o.connect(f); f.connect(g); let last = g; if (dr > 0) { const ws = driveNode(dr); g.connect(ws); last = ws; }
  sendOut(last, wet); o.start(t0); o.stop(t0 + dur + 0.05);
}
function vRing(t0, freqs, dur, peak, wet = 0.2) {
  freqs.forEach((fr, i) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = fr;
    g.gain.setValueAtTime(X, t0); g.gain.exponentialRampToValueAtTime(peak / (1 + i * 0.4), t0 + 0.002); g.gain.exponentialRampToValueAtTime(X, t0 + dur * (1 - i * 0.12));
    o.connect(g); sendOut(g, wet); o.start(t0); o.stop(t0 + dur + 0.05);
  });
}
function vCrackle(t0, dur, peak, count, wet = 0.2) {
  for (let i = 0; i < count; i++) {
    const tt = t0 + Math.random() * dur, a = peak * (0.3 + Math.random() * 0.7) * (1 - (tt - t0) / dur * 0.7);
    vNoise(tt, 0.012 + Math.random() * 0.01, a, 'highpass', 2000 + Math.random() * 3000, 2500 + Math.random() * 4000, 1, { att: 0.001, wet });
  }
}
function startHum(t) {                                 // el zumbido de «listo» (el que gustó) no cambia
  stopHum(); const g = AC.createGain(); g.gain.setValueAtTime(X, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.15);
  const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 7; lg.gain.value = 0.02; l.connect(lg); lg.connect(g.gain); l.start();
  const a = AC.createOscillator(), b = AC.createOscillator(); a.type = 'sine'; b.type = 'sine'; a.frequency.value = 330; b.frequency.value = 333;
  a.connect(g); b.connect(g); g.connect(master); a.start(t); b.start(t); humNodes = { g, os: [a, b, l] };
}

// vRise: como vSaw pero el volumen SUBE hasta el final (risers)
function vRise(t0, type, f0, f1, dur, peak, lp0, lp1, dr = 0, wet = 0.1, q = 1) {
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);

  sendOut(last, wet); o.start(t0); o.stop(t0 + dur + 0.08);
}

function rampTicks(t0, d, n, p0, p1, f0, f1, wet = 0.1) {
  for (let i = 0; i < n; i++) {

    vNoise(tt, 0.012, p0 + (p1 - p0) * u, 'bandpass', f, f, 5, { att: 0.001, wet });
  }
}

// ---------------------------------------------------------------- pestañas y paneles con barra de tiempo
let tab = 'saved';
const grids = { saved: document.getElementById('grid-saved'), wip: document.getElementById('grid-wip'), arc: document.getElementById('grid-arc'), snd: document.getElementById('grid-snd') };
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  for (const k in grids) grids[k].style.display = k === tab ? '' : 'none';
});
const views = scenes.map(s => {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${s.title}</h2><p>${s.text}</p>`;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; sec.appendChild(cv);
  const bar = document.createElement('div'); bar.className = 'bar';
  const btn = document.createElement('button'), back = document.createElement('button'), fwd = document.createElement('button');
  const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 1000; sl.value = 0;
  const tm = document.createElement('span'); tm.className = 'tm';
  btn.textContent = 'Pausa'; back.textContent = '◀'; fwd.textContent = '▶';
  const spk = document.createElement('button'); spk.textContent = '🔊'; spk.title = 'Oír este clip (sólo uno a la vez)';
  bar.append(btn, back, sl, fwd, tm, spk); sec.appendChild(bar); grids[s.tab].appendChild(sec);
  const v = { s, ctx: cv.getContext('2d'), t: 0, playing: true, sl, btn, tm, spk, audio: false };
  const setPlay = p => { v.playing = p; btn.textContent = p ? 'Pausa' : 'Seguir'; if (!p && AC) stopHum(); };
  v.setPlay = setPlay;
  btn.onclick = () => setPlay(!v.playing);
  sl.oninput = () => { setPlay(false); v.t = sl.value / 1000 * totalOf(s); };
  back.onclick = () => { setPlay(false); v.t = Math.max(0, v.t - 0.01); };
  fwd.onclick = () => { setPlay(false); v.t = Math.min(totalOf(s), v.t + 0.01); };
  spk.onclick = () => { const on = !v.audio; views.forEach(x => { x.audio = false; x.spk.classList.remove('on'); }); v.audio = on; spk.classList.toggle('on', on); if (on) { document.getElementById('snd').checked = true; soundOn = true; audioInit(); } };
  return v;
});
let allPaused = false;
document.getElementById('pause').onclick = e => {
  allPaused = !allPaused; e.target.textContent = allPaused ? 'Seguir todo' : 'Pausa todo';
  views.forEach(v => v.setPlay(!allPaused));
};

// ---------------------------------------------------------------- pestaña «Sonidos»: escuchar cada pieza y la secuencia completa
{
  const labEl = document.getElementById('grid-snd');
  const card = (title, desc, obj, play, extra) => {
    const sec = document.createElement('section'); sec.innerHTML = '<h2>' + title + '</h2><p>' + desc + '</p>';
    const row = document.createElement('div'); row.className = 'lab'; sec.appendChild(row);
    for (const key of Object.keys(obj)) { const b = document.createElement('button'); b.textContent = '▶ ' + obj[key].name; b.onclick = () => { audioInit(); play(key); }; row.appendChild(b); }
    if (extra) { const b = document.createElement('button'); b.textContent = extra[0]; b.onclick = extra[1]; row.appendChild(b); }
    labEl.appendChild(sec);
  };
  card('Carga', 'Dura lo que la animación (~0,5 s) mientras el orbe crece y recibe partículas.', CHV, key => CHV[key].fn(1, CH - 0.04));
  card('Listo', 'Se oye al terminar de cargar; después sigue el zumbido de mantener (el que gustó, sin cambios) hasta que sueltas o paras.', RDV, key => RDV[key].fn(1), ['■ parar zumbido', () => { if (AC) stopHum(); }]);
  card('Cadena · primer golpe', 'Llega, impacta y se pega (tensión sostenida ~0,25 s) y luego sale con fuerza. Sustituye al impacto seco sólo en este ataque.', CHN, key => { CHN[key].stick(1, 0.25); setTimeout(() => { if (AC) CHN[key].out(1); }, 250); });
  card('Disparo (soltar)', 'Al soltar el botón: sale el cometa. Algunas variantes barren de izquierda a derecha (mejor con auriculares).', RLV, key => RLV[key].fn(1));
}

const lab = document.getElementById('grid-snd');
const CATS = [['pierceIn', 'Perforación · entrada', 'Al atravesar el cuerpo del primer enemigo.'],
              ['pierceOut', 'Perforación · salida', 'Al salir por el otro lado.'],
              ['impact', 'Impacto final', 'En el último enemigo. Aquí va la fuerza.']];
const labBtn = (parent, text, fn) => { const b = document.createElement('button'); b.textContent = text; b.onclick = () => { audioInit(); fn(); }; parent.appendChild(b); };
for (const [id, title, desc] of CATS) {
  const sec = document.createElement('section'); sec.innerHTML = `<h2>${title}</h2><p>${desc}</p>`;
  const row = document.createElement('div'); row.className = 'lab'; sec.appendChild(row);
  for (const key of ['old', 'A', 'B', 'C']) labBtn(row, '▶ ' + SETS[key].name, () => SETS[key][id](1));
  lab.appendChild(sec);
}
{
  const sec = document.createElement('section'); sec.innerHTML = '<h2>Secuencia completa</h2><p>Carga → listo → mantener → soltar → perforación → impacto, a velocidad real.</p>';
  const row = document.createElement('div'); row.className = 'lab'; sec.appendChild(row);
  const ref = scenes.find(s => s.tab === 'saved' && s.proj), h0 = ref.hits[0], rel = CH + 0.6;
  for (const key of ['old', 'A', 'B', 'C']) labBtn(row, '▶ ' + SETS[key].name, () => {
    const prev = curSet; curSet = key;
    const at = (sec, fn) => setTimeout(() => { if (AC) fn(); }, sec * 1000);
    SFX.charge('R1', 1, CH - 0.04);
    at(CH, () => SFX.ready(1)); at(rel, () => SFX.release(1));
    at(rel + h0.tE - T0, () => SFX.pierceIn(1)); at(rel + h0.tX - T0, () => SFX.pierceOut(1)); at(rel + ref.TB - T0, () => SFX.impact(1));
    setTimeout(() => { curSet = prev; }, (rel + 1.6) * 1000);
  });
  lab.appendChild(sec);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const v of views) {
    if (v.s.tab !== tab) continue;
    const total = totalOf(v.s);
    if (v.playing) {
      const prev = v.t; v.t += dt * speed;
      if (v.t >= total) { v.t = 0; if (AC) stopHum(); }
      else if (soundOn && v.audio && AC) { const k = Math.min(4, 1 / speed); for (const e of eventsOf(v.s)) if (prev < e.t && e.t <= v.t) e.f(k); }
      v.sl.value = v.t / total * 1000;
    }
    v.tm.textContent = v.t.toFixed(2) + 's';
    scene(v.ctx, v.t, v.s);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
