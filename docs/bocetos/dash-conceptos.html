<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conceptos de dash</title>
<style>
  :root { --bg:#1b1d24; --panel:#4a4a4a; --ink:#e8ecf2; --muted:#9aa3b2; --accent:#29c2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { padding:16px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; position:sticky; top:0; background:var(--bg); z-index:2; border-bottom:1px solid #2c303a; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  label { display:flex; gap:8px; align-items:center; color:var(--muted); }
  button { background:#2a2f3a; color:var(--ink); border:1px solid #3a4150; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap:16px; padding:16px; }
  section { background:#23262f; border-radius:10px; padding:12px; }
  h2 { font-size:15px; margin:0 0 4px; }
  p { margin:0 0 8px; color:var(--muted); font-size:13px; }
  canvas { width:100%; height:auto; background:var(--panel); border-radius:6px; display:block; }
  .legend { font-size:12px; color:var(--muted); }
  .legend b.back { color:#ff9a3c; } .legend b.front { color:#5dff8a; }
</style>
</head>
<body>
<header>
  <h1>Conceptos · dash y picado</h1>
  <label>Velocidad <input id="speed" type="range" min="0.05" max="1" step="0.05" value="0.35"> <span id="speedv">0.35×</span></label>
  <button id="pause">Pausa</button>
  <label><input id="layers" type="checkbox"> Ver capas</label>
  <span class="legend">(<b class="back">naranja</b> = detrás del player · <b class="front">verde</b> = delante)</span>
</header>
<main id="grid"></main>
<script>
// ---------------------------------------------------------------- paleta del set (tajos)
const C = {
  white:'#ffffff', core:'#ffe6ea', light:'#9ef2ff', cyan:'#29c2ff', blue:'#1c5cdb', purple:'#7538db',
  dust:'#d9cbb4', dustDark:'#b8a68c', player:'#e07a3c', playerDark:'#8a4520'
};
const W = 640, H = 400, GROUND = 340;

let speed = 0.35, paused = false, showLayers = false;
document.getElementById('speed').oninput = e => { speed = +e.target.value; document.getElementById('speedv').textContent = speed.toFixed(2) + '×'; };
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Seguir' : 'Pausa'; };
document.getElementById('layers').onchange = e => showLayers = e.target.checked;

// ---------------------------------------------------------------- utilidades
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// Capa: en modo "ver capas" todo lo de detrás se tiñe naranja y lo de delante verde.
function col(c, layer) { return showLayers ? (layer === 'back' ? '#ff9a3c' : '#5dff8a') : c; }

function player(ctx, x, y, dir, opts = {}) {
  const { alpha = 1, squash = 0, crouch = 0, lean = 0 } = opts;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(lean * dir);
  ctx.scale(1 + squash, 1 - squash - crouch * 0.35);
  ctx.fillStyle = C.playerDark;
  ctx.beginPath(); ctx.roundRect(-13, -48, 26, 48, 9); ctx.fill();          // cuerpo
  ctx.fillStyle = C.player;
  ctx.beginPath(); ctx.ellipse(4 * dir, -60, 15, 13, 0, 0, Math.PI * 2); ctx.fill(); // cabeza
  ctx.beginPath(); ctx.ellipse(-3 * dir, -78, 4, 11, -0.3 * dir, 0, Math.PI * 2); ctx.fill(); // oreja
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(11 * dir, -62, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Anillo perpendicular a la dirección; se parte en mitad de detrás / de delante.
function ring(ctx, x, y, ang, r, squeeze, width, alpha, dash, half) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.globalAlpha = alpha;
  ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.setLineDash(dash > 0 ? [Math.max(2, 14 * (1 - dash)), 6 + 26 * dash] : []);
  ctx.strokeStyle = col(C.white, half);
  ctx.beginPath();
  // half 'back' = arco superior (lejos), 'front' = inferior (cerca)
  if (half === 'back') ctx.ellipse(0, 0, r * squeeze, r, 0, Math.PI * 0.5, Math.PI * 1.5);
  else ctx.ellipse(0, 0, r * squeeze, r, 0, -Math.PI * 0.5, Math.PI * 0.5);
  ctx.stroke();
  ctx.restore();
}

// Destello de salida: esfera + 2 anillos + se rompe en trazos y desaparece.
function departure(ctx, x, y, ang, t, half) {
  const grow = easeOut(seg(t, 0, 0.12));
  const life = seg(t, 0.05, 0.45);
  const alpha = 1 - easeIn(life);
  const width = lerp(7, 1.2, life);
  const dash = seg(t, 0.15, 0.4);
  // esfera: rellena el primer instante, luego sólo contorno que se expande
  if (half === 'front') {
    ctx.save(); ctx.globalAlpha = alpha;
    const sr = lerp(10, 30, grow) + life * 8;
    if (t < 0.08) { ctx.fillStyle = col(C.white, 'front'); ctx.beginPath(); ctx.arc(x, y, sr, 0, 7); ctx.fill(); }
    ctx.lineWidth = width; ctx.strokeStyle = col(C.white, 'front');
    ctx.setLineDash(dash > 0 ? [Math.max(2, 14 * (1 - dash)), 6 + 26 * dash] : []);
    ctx.beginPath(); ctx.arc(x, y, sr, 0, 7); ctx.stroke(); ctx.restore();
  }
  const ux = Math.cos(ang), uy = Math.sin(ang);
  ring(ctx, x - ux * 12, y - uy * 12, ang, lerp(30, 70, grow), 0.32, width, alpha, dash, half);
  ring(ctx, x + ux * 14, y + uy * 14, ang, lerp(24, 56, grow), 0.32, width, alpha, dash, half);
}

// Hilo blanco del origen al destino.
function thread(ctx, x0, y0, x1, y1, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = col(C.white, 'back'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}

// Cápsula de luz entre cola y cabeza + rayas de velocidad.
function capsule(ctx, tx, ty, hx, hy, thick, alpha, t, seed, layer = 'front') {
  if (alpha <= 0) return;
  const len = Math.hypot(hx - tx, hy - ty); if (len < 1) return;
  const ang = Math.atan2(hy - ty, hx - tx);
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(tx, ty); ctx.rotate(ang);
  const R = rand(seed);
  // rayas de velocidad a los lados
  ctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const off = (R() - 0.5) * thick * 2.6, l0 = R() * len * 0.5, l1 = l0 + len * (0.3 + R() * 0.6);
    ctx.strokeStyle = col(i % 2 ? C.cyan : C.light, layer); ctx.lineWidth = 1.5 + R() * 2;
    ctx.beginPath(); ctx.moveTo(l0, off); ctx.lineTo(Math.min(l1, len + 20), off); ctx.stroke();
  }
  const bands = [[thick, C.cyan], [thick * 0.72, C.light], [thick * 0.42, C.core]];
  for (const [w, c] of bands) {
    ctx.strokeStyle = col(c, layer); ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0); ctx.stroke();
  }
  ctx.strokeStyle = col(C.white, layer); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(len * 0.1, 0); ctx.lineTo(len + thick * 0.4, 0); ctx.stroke();
  ctx.restore();
}

// Onda de choque frontal (bow shock) hecha de piezas pequeñas que juntas dibujan la silueta:
//  · hebras: arcos finos y parciales de la misma familia de parábolas, cada uno con su
//    tramo visible que late; · lenguas: gotitas que nacen en la nariz y resbalan por la
//    envolvente hacia atrás; · chispas que saltan del borde; · un brillo en la nariz.
// Se parte en profundidad con una línea horizontal por la cabeza: arriba detrás, abajo delante.
function bowShock(ctx, hx, hy, ang, t, alpha, scale, layer, seed) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.beginPath();
  if (layer === 'back') ctx.rect(0, 0, W, hy); else ctx.rect(0, hy, W, H - hy);
  ctx.clip();
  ctx.translate(hx, hy); ctx.rotate(ang); ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';

  // envolvente: x = a - y²/b ; tangente dx/dy = -2y/b
  const env = (a, b, y) => a - (y * y) / b;
  const palette = [C.white, C.light, C.cyan, C.blue, C.light, C.white, C.cyan];

  // brillo de la nariz
  const g = ctx.createRadialGradient(30, 0, 0, 30, 0, 26);
  g.addColorStop(0, showLayers ? col(C.white, layer) : 'rgba(255,255,255,0.85)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(30, 0, 26, 0, 7); ctx.fill();

  // hebras: 9 arcos parciales a distintas profundidades, el tramo visible late con el tiempo
  const R = rand(seed);
  for (let k = 0; k < 9; k++) {
    const a = 22 + k * 3.2 + R() * 3, b = 22 + k * 2.4, w = 26 + k * 4.5;
    const ph = R() * 6.28, sp = 18 + R() * 22;
    const y0 = -w * (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * sp + ph)));
    const y1 = w * (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * sp * 1.3 + ph + 2)));
    ctx.strokeStyle = col(palette[k % palette.length], layer);
    ctx.lineWidth = k < 3 ? 3 - k * 0.6 : 1 + R() * 2.2;
    ctx.beginPath();
    for (let i = 0; i <= 18; i++) { const y = y0 + (y1 - y0) * i / 18; ctx.lineTo(env(a, b, y), y); }
    ctx.stroke();
  }

  // lenguas: gotitas que nacen cerca de la nariz y resbalan por la envolvente hacia atrás
  const N = 26;
  for (let i = 0; i < N; i++) {
    const Ri = rand(seed * 31 + i * 7);
    const side = i % 2 ? 1 : -1, rate = 2.2 + Ri() * 2.2, ph = Ri();
    const s = (t * rate + ph) % 1;                               // 0 nariz → 1 fin de la estela
    const a = 26 + Ri() * 16, b = 24 + Ri() * 10, wMax = 34 + Ri() * 18;
    const y = side * s * wMax;
    const back = s > 0.7 ? (s - 0.7) * 160 : 0;                   // al final, la gota sigue recta hacia atrás
    const x = env(a, b, y) - back;
    const len = (9 + Ri() * 10) * (1 - s * 0.6), wid = (2.4 + Ri() * 2.5) * (1 - s * 0.7);
    ctx.save();
    ctx.globalAlpha = alpha * (1 - s) * (s < 0.08 ? s / 0.08 : 1);
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(side, -2 * Math.abs(y) / b));      // a lo largo de la envolvente, hacia atrás
    ctx.fillStyle = col(i % 4 === 0 ? C.white : (i % 4 === 1 ? C.light : (i % 4 === 2 ? C.cyan : C.blue)), layer);
    ctx.beginPath();                                             // gota: cabeza redonda, cola afilada
    ctx.moveTo(-len, 0);
    ctx.quadraticCurveTo(-len * 0.2, -wid, wid * 0.6, 0);
    ctx.quadraticCurveTo(-len * 0.2, wid, -len, 0);
    ctx.fill();
    ctx.restore();
  }

  // chispas que saltan del borde exterior
  for (let i = 0; i < 12; i++) {
    const Ri = rand(seed * 53 + i * 13);
    const side = i % 2 ? 1 : -1, rate = 3 + Ri() * 3, s = (t * rate + Ri()) % 1;
    const y = side * (10 + Ri() * 40), x = env(46, 32, y);
    const d = s * (20 + Ri() * 30);
    ctx.globalAlpha = alpha * (1 - s);
    ctx.fillStyle = col(i % 3 ? C.white : C.cyan, layer);
    ctx.beginPath(); ctx.arc(x - d * 0.8, y + side * d * 0.6, 2.2 * (1 - s) + 0.6, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// Llamitas azules que se desprenden alrededor de un punto.
function wisps(ctx, x, y, t, count, spread, seed, layerFilter) {
  const R = rand(seed);
  for (let i = 0; i < count; i++) {
    const a = R() * Math.PI * 2, delay = R() * 0.5, life = seg(t, delay, delay + 0.6);
    if (life <= 0 || life >= 1) { R(); R(); continue; }
    const layer = Math.sin(a) < 0 ? 'back' : 'front';      // arriba = detrás, abajo = delante
    if (layer !== layerFilter) { R(); R(); continue; }
    const d = spread * (0.3 + easeOut(life) * (0.7 + R()));
    const s = (3 + R() * 6) * (1 - life);
    ctx.save(); ctx.globalAlpha = 1 - life;
    ctx.fillStyle = col(i % 3 ? C.blue : C.cyan, layer);
    ctx.translate(x + Math.cos(a) * d, y + Math.sin(a) * d - life * 18);
    ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(0, 0, s * 1.6, s, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
}

// Impacto en el suelo: polvo con púas + onda + chispas. Puffs de atrás detrás del player.
function impact(ctx, x, t, layer) {
  if (t <= 0 || t > 1) return;
  const R = rand(99);
  const grow = easeOut(seg(t, 0, 0.35)), fade = 1 - easeIn(seg(t, 0.3, 1));
  ctx.save(); ctx.globalAlpha = fade;
  if (layer === 'back') {
    // púas
    for (let i = 0; i < 9; i++) {
      const a = Math.PI + 0.25 + (i / 8) * (Math.PI - 0.5) + (R() - 0.5) * 0.15;
      const len = (40 + R() * 45) * grow;
      ctx.fillStyle = col(C.dust, 'back');
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a - 0.12) * 18, GROUND + Math.sin(a - 0.12) * 18);
      ctx.lineTo(x + Math.cos(a) * (28 + len), GROUND + Math.sin(a) * (28 + len));
      ctx.lineTo(x + Math.cos(a + 0.12) * 18, GROUND + Math.sin(a + 0.12) * 18);
      ctx.fill();
    }
    for (let i = 0; i < 6; i++) {
      const px = x + (R() - 0.5) * 110 * grow, py = GROUND - 14 - R() * 26 * grow, r = (16 + R() * 14) * (0.5 + grow * 0.6);
      ctx.fillStyle = col(i % 2 ? C.dustDark : C.dust, 'back'); ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
    }
    // mitad lejana de la onda
    ctx.strokeStyle = col(C.cyan, 'back'); ctx.lineWidth = 4 * (1 - t) + 1;
    ctx.beginPath(); ctx.ellipse(x, GROUND, 30 + 140 * grow, 6 + 16 * grow, 0, Math.PI, Math.PI * 2); ctx.stroke();
  } else {
    for (let i = 0; i < 5; i++) {
      const px = x + (R() - 0.5) * 150 * grow, py = GROUND - 4 - R() * 10, r = (12 + R() * 12) * (0.5 + grow * 0.6);
      ctx.fillStyle = col(i % 2 ? C.dust : C.dustDark, 'front'); ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = col(C.white, 'front'); ctx.lineWidth = 4 * (1 - t) + 1;
    ctx.beginPath(); ctx.ellipse(x, GROUND, 30 + 140 * grow, 6 + 16 * grow, 0, 0, Math.PI); ctx.stroke();
    // chispas
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI * (0.1 + R() * 0.8), d = 20 + grow * (60 + R() * 70);
      ctx.fillStyle = col(i % 2 ? C.cyan : C.white, 'front');
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, GROUND + Math.sin(a) * d * 0.7, 3 * (1 - t) + 1, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

function ground(ctx) {
  ctx.fillStyle = '#2f5d7a'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#3d7598'; ctx.fillRect(0, GROUND, W, 6);
}

// ---------------------------------------------------------------- una escena = un viaje A→B
// mode 'replace': el player desaparece y la cápsula es el cuerpo. 'over': el player viaja visible
// y la cápsula es una estela detrás de él.
function travelScene(ctx, t, cfg) {
  const { x0, y0, x1, y1, mode, dive } = cfg;
  const T0 = 0.35, TD = dive ? 0.32 : 0.24, T1 = T0 + TD;      // salida, duración del viaje
  const dir = Math.sign(x1 - x0) || 1;
  const ang = Math.atan2(y1 - y0, x1 - x0);
  const travel = easeOut(seg(t, T0, T1));
  const hx = lerp(x0, x1, travel), hy = lerp(y0, y1, travel);
  const tailT = easeIn(seg(t, T0 + 0.03, T1 + 0.12));
  const tx = lerp(x0, x1, tailT), ty = lerp(y0, y1, tailT);
  const td = t - T0;                                                // tiempo desde la salida
  const arrived = t >= T1;
  const capAlpha = 1 - seg(t, T1 + 0.05, T1 + 0.16);
  const bodyY = dive ? -40 : -34;                                   // el centro del cuerpo sobre los pies
  // onda de choque: aparece al salir, revienta un poco hacia delante al llegar y se apaga
  const shockIn = easeOut(seg(t, T0, T0 + 0.04)), shockOut = seg(t, T1, T1 + 0.12);
  const shockAlpha = shockIn * (1 - shockOut);
  const shockScale = (dive ? 1 : 0.8) * (1 + shockOut * 0.6);
  const ux = Math.cos(ang), uy = Math.sin(ang), lead = mode === "over" ? 16 : 8;
  const sx = hx + ux * lead, sy = hy + bodyY + uy * lead;

  ctx.clearRect(0, 0, W, H); ground(ctx);

  // ---------- DETRÁS
  if (td >= 0) departure(ctx, x0, y0 + bodyY, ang, td, 'back');
  thread(ctx, x0, y0 + bodyY, hx, hy + bodyY, td >= 0 ? (1 - seg(t, T1 + 0.05, T1 + 0.35)) : 0);
  if (mode === 'over' && td >= 0) capsule(ctx, tx, ty + bodyY, hx, hy + bodyY, 18, capAlpha, t, 7, 'back');
  if (td >= 0) wisps(ctx, hx, hy + bodyY, seg(t, T0 + 0.1, T1 + 0.7), 22, 34, 3, 'back');
  if (dive && arrived) impact(ctx, x1, seg(t, T1, T1 + 0.8), 'back');
  if (td >= 0) bowShock(ctx, sx, sy, ang, t, shockAlpha, shockScale, "back", 11);

  // ---------- PLAYER
  if (td < 0) {
    const prep = seg(t, 0.15, T0);
    player(ctx, x0, y0, dir, { squash: -prep * 0.12, lean: -prep * 0.25 });
  } else if (mode === 'over' && !arrived) {
    player(ctx, hx, hy, dir, { lean: dive ? 0.6 : 0.5, squash: 0.18 });
  } else if (arrived) {
    const land = seg(t, T1, T1 + 0.18);
    const pop = mode === 'replace' ? easeOut(seg(t, T1, T1 + 0.08)) : 1;
    player(ctx, x1, y1, dir, { alpha: pop, crouch: dive ? (1 - land) * 0.9 : 0, squash: (1 - land) * 0.12 });
  }

  // ---------- DELANTE
  if (td >= 0) departure(ctx, x0, y0 + bodyY, ang, td, 'front');
  if (mode === 'replace' && td >= 0) capsule(ctx, tx, ty + bodyY, hx, hy + bodyY, 24, capAlpha, t, 7, 'front');
  if (td >= 0) wisps(ctx, hx, hy + bodyY, seg(t, T0 + 0.1, T1 + 0.7), 22, 34, 3, 'front');
  if (dive && arrived) impact(ctx, x1, seg(t, T1, T1 + 0.8), 'front');
  if (td >= 0) bowShock(ctx, sx, sy, ang, t, shockAlpha, shockScale, "front", 11);
}

// ---------------------------------------------------------------- paneles
const scenes = [
  { title:'1 · Dash — el player se sustituye',
    text:'El cuerpo desaparece y viaja como una cápsula de luz; reaparece al llegar. Anillos y esfera en el punto de salida.',
    cfg:{ x0:120, y0:GROUND, x1:500, y1:GROUND, mode:'replace' } },
  { title:'2 · Dash — efecto encima del player',
    text:'El player sigue visible; la cápsula es una estela por detrás de él. Mismos anillos de salida.',
    cfg:{ x0:120, y0:GROUND, x1:500, y1:GROUND, mode:'over' } },
  { title:'3 · Picado — el player se sustituye',
    text:'Desde el aire en diagonal hacia el suelo; al llegar, polvo con púas, onda y chispas. El player reaparece agachado.',
    cfg:{ x0:150, y0:110, x1:420, y1:GROUND, mode:'replace', dive:true } },
  { title:'4 · Picado — efecto encima del player',
    text:'El player cae visible con la estela detrás; mismo impacto.',
    cfg:{ x0:150, y0:110, x1:420, y1:GROUND, mode:'over', dive:true } },
];

const grid = document.getElementById('grid');
const views = scenes.map(s => {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${s.title}</h2><p>${s.text}</p>`;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  sec.appendChild(cv); grid.appendChild(sec);
  return { s, ctx: cv.getContext('2d') };
});

const LOOP = 2.2;
let t = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) t = (t + dt * speed) % LOOP;
  for (const v of views) travelScene(v.ctx, t, v.s.cfg);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
